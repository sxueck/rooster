[workspace]
resolver = "2"
members = [
    "crates/rooster",
    "crates/rooster-config",
    "crates/rooster-agent",
    "crates/rooster-hub",
    "crates/rooster-proto",
    "crates/rooster-waf",
    "crates/rooster-nft",
    "crates/rooster-plugin-sdk",
]
exclude = ["crates/rooster-plugin-sdk/example-plugins"]

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false

[workspace.dependencies]
rooster-agent = { path = "crates/rooster-agent" }
rooster-config = { path = "crates/rooster-config" }
rooster-hub = { path = "crates/rooster-hub" }
rooster-nft = { path = "crates/rooster-nft" }
rooster-proto = { path = "crates/rooster-proto" }
rooster-waf = { path = "crates/rooster-waf" }

axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
bcrypt = "0.19"
bytes = "1"
ed25519-dalek = { version = "3", features = ["rand_core"] }
clap = { version = "4.6", features = ["derive"] }
flate2 = "1"
futures-util = "0.3"
hickory-resolver = { version = "0.24", default-features = false, features = ["tokio-runtime"] }
http = "1"
http-body-util = "0.1"
humantime-serde = "1"
hyper = { version = "1", features = ["http1", "http2", "server", "client"] }
hyper-util = { version = "0.1", features = ["tokio", "client", "client-legacy", "server", "http1", "http2"] }
instant-acme = "0.7"
ipnet = "2"
libc = "0.2"
maxminddb = "0.24"
notify = "8"
rand = "0.10"
rcgen = "0.13"
redb = "2"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip"] }
rmp-serde = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
webpki-roots = "1"
wasmtime = "49"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9"
sha2 = "0.10"
thiserror = "2"
time = "0.3"
tower = "0.5"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "net", "fs", "sync", "process", "io-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["rustls-tls-webpki-roots", "connect"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
yamlpatch = "1.30"
yamlpath = "1.30"
yaml_serde = "0.10"

[profile.release]
# LTO disabled: with ThinLTO, rustc 1.98.1 / LLVM 22.1.8 hits a codegen ICE on the
# merged wast parser code ("Cannot select: i32 = X86ISD::FCMP", SIGSEGV in
# ScheduleDAGSDNodes), which makes `cargo build --release` fail. Re-enable LTO
# once the toolchain/LLVM issue is resolved or rustc is pinned to another version.
lto = false
strip = true
