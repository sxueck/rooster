# HTTP-level proxy defaults, the shape most hand-written nginx.conf files use.
# Included from http{} via `include /etc/nginx/conf.d/*.conf;`, so every server
# block below inherits these proxy_set_header directives.
proxy_set_header Host              $http_host;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

# Upgrade handling driven by a map, referenced from chat.demo.test.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
