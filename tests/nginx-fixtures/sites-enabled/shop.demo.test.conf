# Documented-style proxying through a shared snippet that pins Host to
# $proxy_host: the value must survive onboarding as a literal.
server {
    listen 80;
    server_name shop.demo.test;

    location / {
        include /etc/nginx/snippets/proxy-host.conf;
        proxy_pass http://127.0.0.1:3009;
    }
}
