# TLS-terminated API gateway: ACME answer + 80->443 redirect block, then the
# real block with a named single-server upstream, an include inside a location,
# a second proxy location on another port and a static alias.
upstream api_demo_app {
    server 127.0.0.1:3001;
}

server {
    listen 80;
    server_name api.demo.test;

    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.demo.test;

    ssl_certificate     /etc/nginx/e2e/wildcard.crt;
    ssl_certificate_key /etc/nginx/e2e/wildcard.key;

    # Server-level forwarding headers: locations below inherit these.
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Host $host;

    location / {
        include /etc/nginx/proxy_params;
        proxy_pass http://api_demo_app;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_read_timeout 75s;
        client_max_body_size 8m;
    }

    location /static/ {
        alias /var/www/static/;
        expires 7d;
    }
}
