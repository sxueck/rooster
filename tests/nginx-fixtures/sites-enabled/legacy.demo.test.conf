# Legacy app: proxy_pass with a URI suffix (path rewrite), a no-port named
# group, and a static fallback with try_files.
upstream legacy_hosts {
    server 127.0.0.1:3006 max_fails=3 fail_timeout=30s;
}

server {
    listen 80;
    server_name legacy.demo.test;

    location /app/ {
        proxy_pass http://127.0.0.1:3006/api/;
    }

    location /health {
        proxy_pass http://legacy_hosts;
    }

    location / {
        root /var/www/legacy;
        try_files $uri $uri/ =404;
    }
}
