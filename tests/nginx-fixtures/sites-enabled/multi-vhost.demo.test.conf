# Two virtual hosts sharing one file and one port: each server block must be
# discovered and onboarded independently, with its own upstream.
server {
    listen 80;
    server_name blue.demo.test;

    location / {
        proxy_pass http://127.0.0.1:3007;
    }
}

server {
    listen 80;
    server_name green.demo.test;

    location / {
        proxy_pass http://127.0.0.1:3008;
    }

    location /internal/ {
        proxy_pass http://127.0.0.1:3008;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
}
