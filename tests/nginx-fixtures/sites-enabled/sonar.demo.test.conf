# HTTPS origin with a self-signed certificate: proxy_ssl_* tuning plus an
# explicit proxy_redirect off. Exercises the https-upstream attach path.
server {
    listen 80;
    server_name sonar.demo.test;

    location / {
        proxy_pass https://127.0.0.1:3443;
        proxy_ssl_server_name on;
        proxy_ssl_name sonar-origin.demo.test;
        proxy_redirect off;
        proxy_buffering on;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}
