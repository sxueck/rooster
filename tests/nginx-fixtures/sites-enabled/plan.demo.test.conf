# Load-balanced upstream group: one primary plus a backup. Rooster cannot
# represent N backends behind one loopback listener without changing failover
# semantics, so this stays a manual-integration case.
upstream plan_backend {
    server 127.0.0.1:3004;
    server 127.0.0.1:3005 backup;
}

server {
    listen 80;
    server_name plan.demo.test;

    location / {
        proxy_pass http://plan_backend;
    }
}
