# WebSocket chat: two proxy locations to the same backend plus a static asset
# regex location. The Upgrade/Connection pair is the canonical websocket shape.
server {
    listen 80;
    server_name chat.demo.test;

    location / {
        proxy_pass http://127.0.0.1:3003;
        access_log /var/log/nginx/chat.access.log;
    }

    location /ws {
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location ~* \.(?:js|css|png|ico)$ {
        root /var/www/chat;
        access_log off;
    }
}
