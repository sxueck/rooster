# Debian default catch-all shaped like a real hardened box: a server-level
# `set` + `if` gate around the document root, plus the ACME answer.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    set $do_main_server 1;

    if ($do_main_server) {
        set $gate main;
    }

    location / {
        root /var/www/html;
        index index.html index.htm;
        try_files $uri $uri/ =404;
    }

    location = /50x.html {
        root /var/www/html;
    }
}
