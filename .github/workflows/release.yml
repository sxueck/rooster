name: release

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.suffix }})
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # aarch64 用 GitHub 原生 arm runner(public 仓库免费),避免
          # ring 交叉编译的 sysroot 陷阱(宿主 /usr/include 泄入 gcc-cross)。
          - suffix: x86_64
            runs-on: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - suffix: aarch64
            runs-on: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    env:
      SUFFIX: ${{ matrix.suffix }}
      TARGET: ${{ matrix.target }}
    steps:
      # v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      # v2
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: |
          cargo build --release --bin rooster --target "$TARGET"
          "target/$TARGET/release/rooster" --version
          "target/$TARGET/release/rooster" agent upgrade-guard --help >/dev/null

      # 产物只保留压缩形态(gz ~2.7x / xz ~4x):上传面板前本地解压再签名。
      - name: Package
        run: |
          case "$GITHUB_REF" in
            refs/tags/v*) ver="${GITHUB_REF#refs/tags/v}" ;;
            *) ver="main-${GITHUB_SHA::7}" ;;
          esac
          mkdir dist
          bin="rooster-$ver-$SUFFIX"
          cp "target/$TARGET/release/rooster" "dist/$bin"
          gzip -9 -k "dist/$bin"
          xz -9 -T0 -k "dist/$bin"
          rm "dist/$bin"
          (cd dist && sha256sum "$bin.gz" "$bin.xz" > SHA256SUMS)

      # v4
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rooster-${{ matrix.suffix }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: rooster-*
          merge-multiple: true
          path: release

      # runner 自带 gh:create 失败重跑时 release 可能已建,先 view 再补传。
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --title "rooster ${tag#v}" \
            --notes 'Compressed rooster binaries (-x86_64 / -aarch64) plus SHA256SUMS. Decompress, sign with your Ed25519 upgrade key, then upload through the panel as version <ver>-<arch>.' \
            --verify-tag
          gh release upload "$tag" release/* --clobber --repo "$GITHUB_REPOSITORY"
