name: release

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.suffix }})
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # aarch64 用 GitHub 原生 arm runner(public 仓库免费),避免
          # ring 交叉编译的 sysroot 陷阱(宿主 /usr/include 泄入 gcc-cross)。
          - suffix: x86_64
            runs-on: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - suffix: aarch64
            runs-on: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    env:
      SUFFIX: ${{ matrix.suffix }}
      TARGET: ${{ matrix.target }}
      CARGO_BUILD_JOBS: 1
    steps:
      # v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set binary version
        run: |
          case "$GITHUB_REF" in
            refs/tags/v*) version="${GITHUB_REF#refs/tags/v}" ;;
            *) version="main-${GITHUB_SHA::7}" ;;
          esac
          echo "ROOSTER_VERSION=$version" >> "$GITHUB_ENV"

      - name: Build
        run: |
          cargo build --locked --release --bin rooster --target "$TARGET"
          "target/$TARGET/release/rooster" --version
          "target/$TARGET/release/rooster" agent upgrade-guard --help >/dev/null

      - name: Package
        run: |
          sh scripts/package-agent.sh "target/$TARGET/release/rooster" dist "$SUFFIX"
          rm dist/SHA256SUMS
          mv dist/manifest.json "dist/manifest-$SUFFIX.json"

      # v4
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rooster-${{ matrix.suffix }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: rooster-*
          merge-multiple: true
          path: release

      - name: Combine checksums
        run: cat release/SHA256SUMS-* > release/SHA256SUMS

      # runner 自带 gh:create 失败重跑时 release 可能已建,先 view 再补传。
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --title "rooster ${tag#v}" \
            --notes 'Raw and compressed rooster binaries (-x86_64 / -aarch64), manifests and SHA256SUMS. Sign raw binaries with your deployment Ed25519 upgrade key using scripts/publish-agent.py, then upload as version <ver>-<arch>.' \
            --verify-tag
          gh release upload "$tag" release/* --clobber --repo "$GITHUB_REPOSITORY"
